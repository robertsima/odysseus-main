# Agamemnon → Claude Code cloud runner.
#
# Agamemnon starts this workflow (workflow_dispatch) to hand a coding task to
# Anthropic's official Claude Code GitHub Action. Claude runs in GitHub's cloud
# with YOUR credential from this repository's secrets; Agamemnon never sees it.
#
# Two ways to set it up:
#
# A. Hub (one repository serves every repository). Recommended.
#   1. Copy this file to .github/workflows/odysseus-claude.yml on the default
#      branch of ONE PRIVATE repository you own (the hub). A public
#      repository's Actions logs are public, so Agamemnon refuses to run a
#      private repository's task through a public hub.
#   2. In the hub, add the secrets
#        CLAUDE_CODE_OAUTH_TOKEN      from `claude setup-token` (your Pro/Max plan)
#                                     (or ANTHROPIC_API_KEY, billed per token)
#        ODYSSEUS_APP_PRIVATE_KEY     the GitHub App private key (.pem) Agamemnon uses
#      and the repository variable
#        ODYSSEUS_APP_ID              that GitHub App's id.
#   3. Give the GitHub App Contents: write and Pull requests: write, installed
#      on every repository Claude may work on ("All repositories" = any repo).
#   4. In Agamemnon: Settings › Tools › Claude Code › Cloud runner, set the hub
#      repository, and list the target repositories (or * for any repository
#      the GitHub App can reach).
#   Agamemnon then dispatches here with `repository` = the target. The run checks
#   the target out with a GitHub App token scoped to that one repository, and
#   pushes the branch and opens the draft pull request THERE. Nothing needs
#   installing in the target repositories.
#
# B. Per repository (no `repository` input).
#   1. Copy this file to .github/workflows/odysseus-claude.yml on the default
#      branch of each repository.
#   2. Add ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
#      Running `/install-github-app` inside Claude Code sets this up for you.
#   3. Settings › Actions › General › Workflow permissions: allow "Read and
#      write" and tick "Allow GitHub Actions to create and approve pull
#      requests" (otherwise the run pushes a branch but cannot open the PR).
#
# Either way, the GitHub credential Agamemnon uses needs Actions: write,
# Contents: read and Pull requests: read on the repository it dispatches to.
#
# Security: dispatch inputs are untrusted text. They reach shell steps only
# through environment variables, never through ${{ }} interpolation inside a
# `run:` script. Claude gets file tools and read-only git; the commit, push and
# draft PR are done by the steps below, never by Claude. In hub mode the App
# token is minted for the target repository only.

name: Agamemnon → Claude Code
run-name: "Agamemnon task ${{ inputs.task_id }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Agamemnon task id (letters, digits, dashes)"
        required: true
        type: string
      prompt:
        description: "The task for Claude"
        required: true
        type: string
      base_branch:
        description: "Branch to start from (empty = default branch; required with repository)"
        required: false
        type: string
        default: ""
      repository:
        description: "Hub mode: owner/name of the repository to work on (empty = this one)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: odysseus-claude-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check inputs
        id: target
        env:
          TASK_ID: ${{ inputs.task_id }}
          REPOSITORY: ${{ inputs.repository }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          THIS_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$TASK_ID" in
            ''|*[!A-Za-z0-9-]*) echo "::error::invalid task id"; exit 1 ;;
          esac
          case "$BASE_BRANCH" in
            *[!A-Za-z0-9._/-]*) echo "::error::invalid base branch"; exit 1 ;;
          esac
          if [ -n "$REPOSITORY" ]; then
            if ! printf '%s' "$REPOSITORY" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'; then
              echo "::error::invalid repository"; exit 1
            fi
            if [ -z "$BASE_BRANCH" ]; then
              echo "::error::base_branch is required with repository"; exit 1
            fi
            {
              echo "hub=true"
              echo "repository=$REPOSITORY"
              echo "owner=${REPOSITORY%%/*}"
              echo "name=${REPOSITORY#*/}"
              echo "base=$BASE_BRANCH"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "hub=false"
              echo "repository=$THIS_REPOSITORY"
              echo "base=${BASE_BRANCH:-$DEFAULT_BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Hub mode only: a token for the target repository alone.
      - name: GitHub App token for the target repository
        id: app
        if: steps.target.outputs.hub == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.ODYSSEUS_APP_ID }}
          private-key: ${{ secrets.ODYSSEUS_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          # Only what the run needs: push the branch, open the draft PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.base }}
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0
          # Claude runs in this checkout; keep the token out of .git/config.
          # The push step below authenticates explicitly.
          persist-credentials: false

      - name: Create work branch
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: git switch -c "claude/odysseus-$TASK_ID"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Hub mode: the target repository's App token, so the action does not
          # need the Claude GitHub App installed there. Empty per repository.
          github_token: ${{ steps.app.outputs.token }}
          prompt: ${{ inputs.prompt }}
          # A GitHub App dispatch runs as "<app>[bot]", which the action refuses
          # unless listed. Only workflow_dispatch starts this workflow, and
          # GitHub already requires write access to dispatch it.
          allowed_bots: ${{ github.actor }}
          claude_args: >-
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "You are working for Agamemnon in a GitHub Actions checkout on a prepared branch. Make the requested change with the file tools. Do not commit, push or open pull requests; the workflow does that after you finish. End with a short summary of what you changed and anything left undone."

      - name: Collect result
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ.get("EXECUTION_FILE") or ""
          text = ""
          try:
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              items = data if isinstance(data, list) else [data]
              for item in reversed(items):
                  if isinstance(item, dict) and item.get("type") == "result":
                      text = str(item.get("result") or "")
                      break
          except Exception as exc:
              text = f"(could not read Claude's result: {exc})"
          if not text.strip():
              text = "(Claude finished without a closing summary.)"
          with open("claude-result.md", "w", encoding="utf-8") as fh:
              fh.write(text.strip() + "\n\n")
              fh.write(f"_Conclusion: {os.environ.get('CONCLUSION') or 'unknown'}. Opened by Agamemnon._\n")
          PY

      - name: Commit, push and open draft PR
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TASK_ID: ${{ inputs.task_id }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          BASE_BRANCH: ${{ steps.target.outputs.base }}
        run: |
          git add -A -- . ':!claude-result.md'
          if git diff --cached --quiet; then
            echo "No file changes to publish."
            exit 0
          fi
          git -c user.name="claude[bot]" -c user.email="41898282+claude[bot]@users.noreply.github.com" \
            commit -m "Agamemnon task $TASK_ID (Claude Code)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "claude/odysseus-$TASK_ID"
          gh pr create --repo "$REPOSITORY" --draft --base "$BASE_BRANCH" --head "claude/odysseus-$TASK_ID" \
            --title "Agamemnon task $TASK_ID (Claude Code)" --body-file claude-result.md \
            || echo "::warning::Branch pushed, but the draft PR could not be opened (per repository: check 'Allow GitHub Actions to create and approve pull requests'; hub: the GitHub App needs Pull requests: write)."

      - name: Upload result for Agamemnon
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: odysseus-result
          path: claude-result.md
          if-no-files-found: ignore
          retention-days: 7
