<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
<title id="title">Distinct Agamemnon Phalanx soldiers at display sizes</title>
<desc id="desc">Five geometrically distinct Trojan soldier silhouettes with model-driven color accents, plus 32, 42 and 64 pixel size checks.</desc>
<rect width="860" height="300" fill="#111417"/>
<g style="color:#d7b35a" transform="translate(30 24) scale(.25)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-primary"/></g>
<g style="color:#d97757" transform="translate(195 24) scale(.25)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-worker"/></g>
<g style="color:#7aa2f7" transform="translate(360 24) scale(.25)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-scout"/></g>
<g style="color:#74c69d" transform="translate(525 24) scale(.25)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-reviewer"/></g>
<g style="color:#c792ea" transform="translate(690 24) scale(.25)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-specialist"/></g>
<g fill="#f7f8fa" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1"><text x="94" y="178">COMMAND</text><text x="259" y="178">ENGINEER</text><text x="424" y="178">SCOUT</text><text x="589" y="178">REVIEW</text><text x="754" y="178">SPECIALIST</text></g>
<g fill="#aeb6bd" font-family="Space Grotesk, sans-serif" font-size="12"><text x="30" y="238">ACTUAL SIZE CHECK</text><text x="232" y="238">32 PX</text><text x="347" y="238">42 PX</text><text x="477" y="238">64 PX</text></g>
<g style="color:#d7b35a" transform="translate(274 218) scale(.0625)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-primary"/></g>
<g style="color:#d97757" transform="translate(397 212) scale(.08203125)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-worker"/></g>
<g style="color:#7aa2f7" transform="translate(532 199) scale(.125)"><use href="../static/branding/agamemnon-agent-marks.svg#soldier-scout"/></g>
</svg>
