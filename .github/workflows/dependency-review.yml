# Supply-chain review
#
# Purpose: defend against "side-chain" / supply-chain attacks -- a pull request
# that adds (or bumps) a dependency to a version with a known vulnerability or a
# disallowed license. Two layers:
#
#   - dependency-review: runs ONLY on pull requests. It compares the
#     dependencies before and after the PR and blocks the merge if the change
#     pulls in a package with a known security advisory. This is the gate.
#   - pip-audit: scans the project's current Python requirements against the
#     advisory database. Advisory only (it never blocks a merge), because it can
#     flag a pre-existing issue in an already-shipped dependency.
#
# On a pull request both run only when a dependency file changes. pip-audit
# also runs weekly, which is how a new advisory for a pinned package shows up.

name: Dependency review

on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'package*.json'
      - '.github/workflows/dependency-review.yml'
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# Default-deny token; jobs grant only read access.
permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    # Only meaningful on a pull request -- it needs a base..head diff to review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A fork starts with Dependency graph off, and then every PR failed this
      # job with "Dependency review is not supported on this repository"
      # (2026-10-02: agents spent rounds investigating it on each PR). Probe
      # the same API the action uses; skip with a notice only for that
      # condition, and let the action run (and report) everything else.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if out=$(gh api "repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" 2>&1 >/dev/null); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE "HTTP 403|dependency graph is enabled" <<<"$out"; then
            # The API answers a bare 403 "Forbidden" while the graph is off;
            # the action turns that same 403 into its "not supported" error.
            echo "::notice title=Dependency review skipped::Dependency graph is off for ${REPO}. Turn it on under Settings > Code security to enable this gate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Fail the PR on any newly introduced moderate-or-worse advisory.
          fail-on-severity: moderate

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: report known-vulnerable Python deps without blocking the merge.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # `pip-audit -r` resolves into a temporary venv whose pip upgrade failed
      # on PR #62 ("Failed to upgrade `pip`"), so nothing was audited. Install
      # the requirements here and audit this environment instead.
      - name: Run pip-audit on requirements
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-optional.txt pip-audit==2.10.0
          pip-audit --strict
