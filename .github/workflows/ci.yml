name: CI

on:
  push:
    # restructure/** carries the test-suite restructure
    # (website/testing-restructure-2026-10-03.md) until it lands on dev.
    branches: [main, dev, "restructure/**"]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-tests:
    name: Tests covering the change (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Lists the tests that cover the PR's changes (scripts/affected_tests.py,
      # D15): the nightly coverage map, then the mirrored folders, then tests
      # that mention a changed module. The blocking jobs below decide.
      - name: Report the tests covering this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "## Tests covering this change (report-only)"
            echo
            echo '```'
            python3 scripts/affected_tests.py --base "$BASE_SHA" || echo "(could not compute)"
            echo '```'
            echo
            echo 'Run them locally with `python -m tests.run affected`.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  red-evidence:
    # A PR's new tests should fail without its production change (D17 in
    # website/testing-restructure-2026-10-03.md). Report-only while it is
    # calibrated; it becomes a required check afterwards.
    name: Red evidence (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: ".nvmrc"
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: mkdir -p data
      - name: Run new and changed tests against the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python .github/scripts/red_evidence.py --base "$BASE_SHA" --head "$HEAD_SHA" --labels "$LABELS" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done
      # Every node test under tests/. The glob is quoted so node expands it,
      # and npm ci installs the DOM library the frontend tests import.
      - name: Node tests
        run: |
          npm ci --ignore-scripts
          node --test --test-timeout=60000 "tests/**/*.test.mjs"

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # Make Python test validation authoritative for the configured scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this PR only touches repository prose outside the Pages site.
      # If so, skip the expensive pytest run while still reporting a passing check.
      - name: Check for docs-only changes
        id: docs-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Keep website/ and assets/branding/ out of this bypass: pytest owns
          # regression guards for their published-file and orphan-asset contracts.
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          non_docs=$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected — skipping pytest."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
          cache: pip
      # Pytest also runs JS behavioral tests via subprocess; match Docker.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          node-version-file: ".nvmrc"
      - run: pip install -r requirements.txt -r requirements-test.txt
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      # Browser tests run in their own job below; nightly tests run nightly.
      - run: python -m pytest -q -n auto -m "not browser and not nightly" -rfE
        if: steps.docs-check.outputs.docs_only != 'true'

  browser-tests:
    name: Browser tests (pytest -m browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: mkdir -p data
      # ubuntu-latest ships google-chrome, which Playwright drives with
      # channel="chrome". ODYSSEUS_REQUIRE_BROWSER turns a missing browser
      # into a failure here instead of a run where every test skips.
      - run: python -m pytest -q -n 2 -m "browser and not nightly" -rfEs --durations=15
        env:
          ODYSSEUS_REQUIRE_BROWSER: "1"
          ODYSSEUS_BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-failures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: ${{ runner.temp }}/browser-failures
          if-no-files-found: ignore
