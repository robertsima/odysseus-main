[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Fast-lane marker (issue #3443). Opt-in. The fast lane runs `not slow`; mark a test slow only with
    # duration evidence (see tests/run_focus.py --durations and tests/README.md).
    "slow: opt-in marker for known-slow tests; excluded by the fast lane (not slow)",
    # Lanes and guards from website/testing-restructure-2026-10-03.md.
    "browser: drives a real browser; runs in the browser CI job, not python-tests",
    "nightly: too slow or too broad for every push; runs in the nightly workflow",
    "security: guards owner scope, auth, confinement, SSRF, sensitivity or approval; always runs",
    "allow_network: may resolve hostnames and connect beyond loopback (tests/plugins/network_guard.py)",
]
