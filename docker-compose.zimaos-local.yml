# Local dry-run of the ZimaOS deployment.
#
# Mirrors the ZimaOS/CasaOS stack shape — bind mounts instead of named volumes,
# the same service set, the same /app/data/personal_docs vault layout — but
# builds the image from this checkout instead of pulling from GHCR, so you can
# test changes before publishing.
#
#   docker compose -f docker-compose.zimaos-local.yml up --build
#
# Host paths default to ./zima-local/... so the whole thing is self-contained
# and disposable. Point them at real directories via .env:
#   ODY_APPDATA=./zima-local/AppData/odysseus
#   ODY_VAULT=D:/Obsidian
#
# The ZimaOS file uses /DATA/AppData/odysseus and /DATA/Vault for these.

name: odysseus-local

services:
  odysseus:
    # ZimaOS pulls ghcr.io/robertsima/odysseus-main:<tag>; here we build.
    build: .
    depends_on:
      chromadb:
        condition: service_started
      searxng:
        condition: service_healthy
    # Only the variables listed here reach the container: there is no
    # env_file, and `docker compose` reads .env just to fill the ${...}
    # placeholders. A line is here only if its value is required, differs
    # from the application default, or feeds an optional feature; the rest (auth on,
    # loopback bypass off, CORS, sqlite path, FastEmbed model/cache, Lotus
    # paths, STT on CPU/int8, in-process pollers/tasks) is already the code
    # default. Session cookies follow the request scheme by themselves, so
    # SECURE_COOKIES is deliberately absent. Preferences belong in Settings,
    # not here -- see website/configuration.md ("ZimaOS minimal environment").
    environment:
      # ---- required ----
      # Match the host user that owns the bind-mounted AppData tree.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      SEARXNG_INSTANCE: http://searxng:8080
      # Which vault trees are indexed, and under which sensitivity label.
      # Declared next to the mounts rather than left to post-boot admin state:
      # without it a fresh install came up with the vaults mounted, unindexed
      # and UNLABELLED -- and an unlabelled Journal is a public Journal, which
      # hosted models and agent file tools are then free to read. The label is
      # what closes the Journal to LLMs; it does not restrict the human UI.
      ODYSSEUS_PERSONAL_DIRS: ${ODYSSEUS_PERSONAL_DIRS:-Vault Mind:public,AI Mind:public,Journal:private}
      # First boot only: seeds the admin password when data/auth.json does
      # not exist yet. Ignored afterwards; change the password in Settings.
      ODYSSEUS_ADMIN_PASSWORD: ${ODYSSEUS_ADMIN_PASSWORD:-}

      # ---- optional: built-in GitHub MCP (read; write needs ODYSSEUS_GITHUB_MCP_WRITE=1) ----
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      ODYSSEUS_GITHUB_MCP_WRITE: ${ODYSSEUS_GITHUB_MCP_WRITE:-}

      # ---- optional: agent worktree publishing + Claude Code cloud runner ----
      # Master switch for pushing agent branches / opening draft PRs.
      ODYSSEUS_AGENT_PUBLISH_ENABLED: ${ODYSSEUS_AGENT_PUBLISH_ENABLED:-}
      # The one owner/name repository the agent may push to.
      ODYSSEUS_AGENT_REPO: ${ODYSSEUS_AGENT_REPO:-}
      # Checkout the worktrees branch from (the image has no .git), e.g.
      # /app/data/development/odysseus-main.
      ODYSSEUS_AGENT_SOURCE_REPO: ${ODYSSEUS_AGENT_SOURCE_REPO:-}
      # GitHub App credential, also used by the Claude Code cloud runner.
      # Keep the key inside the data mount, e.g. /app/data/github-app.pem.
      ODYSSEUS_GITHUB_APP_ID: ${ODYSSEUS_GITHUB_APP_ID:-}
      ODYSSEUS_GITHUB_APP_INSTALLATION_ID: ${ODYSSEUS_GITHUB_APP_INSTALLATION_ID:-}
      ODYSSEUS_GITHUB_APP_PRIVATE_KEY_PATH: ${ODYSSEUS_GITHUB_APP_PRIVATE_KEY_PATH:-}

      # ---- optional: Todoist MCP ----
      TODOIST_API_TOKEN: ${TODOIST_API_TOKEN:-}

      # ---- optional: Windows Pi worker over SSH ----
      ODYSSEUS_PI_WORKER_HOST: ${ODYSSEUS_PI_WORKER_HOST:-}
      ODYSSEUS_PI_WORKER_IDENTITY_FILE: ${ODYSSEUS_PI_WORKER_IDENTITY_FILE:-}
      # No value on purpose: passed only when .env sets it. An EMPTY
      # script/root is rejected as an invalid path instead of meaning "default".
      ODYSSEUS_PI_WORKER_SCRIPT:
      ODYSSEUS_PI_WORKER_ROOT:

      # ---- optional: Google OAuth (Gmail/Workspace mail, Google Calendar) ----
      # Behind HTTPS or a proxy also set GOOGLE_OAUTH_REDIRECT_URI and
      # GOOGLE_CALENDAR_OAUTH_REDIRECT_URI; plain LAN HTTP infers them.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    extra_hosts:
      # Reach a model served on the Docker host, e.g. Ollama at
      # http://host.docker.internal:11434. Classified local by
      # model_context.is_local_endpoint. Private docs still require the
      # session's explicit private-read grant.
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    # The agent's bash/python run in a bubblewrap sandbox that sees only the
    # chat's workspace (src/shell_sandbox.py). bubblewrap needs what Docker
    # withholds by default:
    #   seccomp/apparmor=unconfined -- the default profiles block the calls
    #     that create unprivileged user namespaces. Without them there is no
    #     sandbox and the shell keeps requiring the private-vault grant.
    #   systempaths=unconfined -- Docker masks /proc paths (kcore, keys,
    #     timer_list, ...; /proc/sys and /proc/sysrq-trigger read-only), and
    #     kernels that enforce the "procfs must be fully visible" rule then
    #     refuse the sandbox its own /proc: "Can't mount proc on /proc:
    #     Operation not permitted". (Docker Desktop's WSL2 kernel did not
    #     enforce it in testing.) Without this line the app falls back to a
    #     degraded sandbox that has no /proc.
    # Trade-off of systempaths=unconfined: /proc/sys, /proc/sysrq-trigger,
    # /proc/kcore etc. are no longer masked in this container. The app process
    # (uid PUID) gains little beyond reading a few kernel-info files: writing
    # them, or reading kcore, needs root. Container ROOT, however, could write
    # host-wide sysctls such as kernel.core_pattern, a known route from
    # container root to host root. Root in here is the entrypoint (before gosu
    # drops to PUID) and any plain `docker exec`, so use `docker exec -u 1000`
    # (your PUID) for routine work. no-new-privileges blocks regaining root via setuid
    # binaries; gosu only drops privileges, which it permits. No capabilities
    # are added.
    # Verify after recreating:
    #   docker inspect <container> --format '{{json .HostConfig.MaskedPaths}} {{json .HostConfig.ReadonlyPaths}}'
    # prints `[] []`, and the app log shows `[shell-sandbox] available`.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data:/app/data
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/logs:/app/logs
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/ssh:/app/.ssh
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/huggingface:/app/.cache/huggingface
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/local:/app/.local

      # Vaults nested inside /app/data so the personal-docs API's PERSONAL_DIR
      # confinement accepts them. A bind mount is a mount point, not a symlink,
      # so realpath() resolves it to itself and it passes the check.
      #
      # ONE path per vault, deliberately. These used to be mounted twice — :ro
      # here for indexing and again under /app/workspace for the file tools —
      # which meant `search_documents` cited a path that could be read but not
      # written, while the writable copy lived at a second path that was off the
      # tool allowlist entirely and only reachable by binding a workspace, which
      # in turn revoked every other path. Retrieval and editing now name the
      # same file.
      #
      # Writability is a separate axis from the RAG public/private label:
      # All mounts are writable for the authenticated human vault editor.
      # LLM/agent access is governed inside Odysseus by the folder policy:
      # public/private controls reads and readonly controls model writes.
      - ${ODY_VAULT:-./zima-local/Vault}/Vault Mind:/app/data/personal_docs/Vault Mind
      - ${ODY_VAULT:-./zima-local/Vault}/AI Mind:/app/data/personal_docs/AI Mind
      # On ZimaOS this was /app/journal via vault_watch.py into a separate,
      # ungated collection. Native indexing puts it under the sensitivity filter.
      - ${ODY_VAULT:-./zima-local/Vault}/Private/Journal:/app/data/personal_docs/Journal

  chromadb:
    # Unpinned. Pin a tag you have verified (as searxng is below) so a
    # recreate cannot silently pull an incompatible ChromaDB release.
    image: docker.io/chromadb/chroma:latest
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    restart: unless-stopped
    volumes:
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/chromadb:/chroma/chroma

  searxng:
    image: docker.io/searxng/searxng:2026.9.25-12f8b6515
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    entrypoint:
      - /bin/sh
      - -c
      # NOTE the $$ escaping. Compose turns $$ into a literal $ for the shell.
      # The ZimaOS copy of this block lost it, so its sed substituted an EMPTY
      # secret and SearXNG ran with secret_key: "". Keep the $$ intact, or
      # pre-render settings.yml on the host and drop this templating entirely.
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        # Advisory: a settings file the migration cannot parse or rewrite must
        # not be what stops searxng from booting. It explains itself on stderr
        # and we carry on, letting searxng report anything genuinely wrong.
        /usr/local/searxng/.venv/bin/python /tmp/migrate-searxng-settings.py /etc/searxng/settings.yml || true
        exec /usr/local/searxng/entrypoint.sh
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/searxng:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro
      - ./scripts/migrate_searxng_settings.py:/tmp/migrate-searxng-settings.py:ro

  ntfy:
    # Unpinned (implicit :latest). Pin a tag you have verified.
    image: docker.io/binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8091}
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    restart: unless-stopped
    volumes:
      - ${ODY_APPDATA:-./zima-local/AppData/odysseus}/data/ntfy:/var/cache/ntfy

# ZimaOS/CasaOS app-store manifest metadata. Read only by CasaOS's app-store
# tooling (ignored by plain `docker compose`), so it belongs on the
# ZimaOS-named overlay rather than the generic base compose file.
x-casaos:
    architectures:
        - amd64
    author: robertsima
    category: AI
    description:
        en_us: Self-hosted AI workspace running on ZimaOS.
    developer: Odysseus
    hostname: odysseus.nas
    icon: https://raw.githubusercontent.com/odysseus-dev/odysseus/main/static/icons/icon-512.png
    index: /
    is_uncontrolled: false
    main: odysseus
    port_map: "7000"
    scheme: http
    store_app_id: odysseus
    title:
        custom: Odysseus
        en_us: Odysseus
